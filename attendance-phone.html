<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111111">
    <meta name="referrer" content="no-referrer">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Iron Grind Scan">
    <title>Phone Attendance Scanner | Iron Grind</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css?v=20261104-remember-phone">
    <link rel="manifest" href="attendance-app.webmanifest">
    <link rel="apple-touch-icon" href="assets/images/iron-grind-mark-192.png">
    <style>
        body.phone-scanner-page { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #090909; color: #f3f4f6; }
        .phone-scanner-card { width: min(100%, 520px); padding: 24px; background: #151515; border: 1px solid #343434; border-radius: 18px; }
        .phone-scanner-card h1 { margin: 0 0 8px; font-size: 1.35rem; }
        .phone-scanner-card p { color: #adb4c2; line-height: 1.5; }
        #phoneQrReader { overflow: hidden; border-radius: 14px; background: #050505; }
        #phoneQrStatus { min-height: 48px; padding: 12px; border-radius: 10px; background: #202020; color: #f3f4f6; }
        #phoneQrStatus.error { color: #fecaca; background: rgba(127,29,29,.35); }
        .phone-scanner-button { width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 10px; background: #760000; color: white; font-weight: 700; }
        .phone-install-button { display: none; width: 100%; margin-top: 10px; padding: 12px; border: 1px solid #565656; border-radius: 10px; background: #222; color: white; font-weight: 700; }
        .phone-install-help { display: none; margin-top: 12px; padding: 12px; border: 1px solid #444; border-radius: 10px; font-size: .9rem; }
    </style>
</head>
<body class="phone-scanner-page">
    <main class="phone-scanner-card">
        <h1><i class="fas fa-qrcode"></i> Attendance Scanner</h1>
        <p id="phoneScannerInstructions">Point your phone camera at a member’s Iron Grind QR code. Attendance will be recorded on the paired admin page.</p>
        <div id="phoneQrReader"></div>
        <p id="phoneQrStatus" role="status" aria-live="polite">Checking this pairing link…</p>
        <button id="phoneInstallButton" class="phone-install-button" type="button" onclick="installPhoneAttendanceApp()">Install attendance app</button>
        <p id="phoneInstallHelp" class="phone-install-help">To add this app: open your browser menu, then choose <strong>Add to Home Screen</strong> or <strong>Install app</strong>.</p>
        <button id="phoneCameraButton" class="phone-scanner-button" type="button" onclick="togglePhoneAttendanceCamera()">Open camera</button>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="assets/js/attendance-phone.js?v=20261104-remember-pairing"></script>
</body>
</html>
