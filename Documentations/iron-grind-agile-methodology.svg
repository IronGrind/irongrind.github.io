<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">IronGrind Agile methodology infographic</title><desc id="description">Plan and Design feed into a continuous circular loop of Develop, Test, Deploy, and Review. A connector leads from the cycle to Launch.</desc><rect width="1200" height="900" fill="#fff"/><style>text{font-family:Arial,sans-serif}.maintitle{font-size:30px;font-weight:700;letter-spacing:3px;fill:#20295a}.num{font-size:25px;font-weight:700;fill:#fff}.wlabel{font-size:13px;font-weight:700;fill:#fff}.center1{font-size:39px;font-weight:700;fill:#22295d}.center2{font-size:18px;fill:#424b63}.ribbon{font-size:17px;font-weight:700;fill:#fff}.stepno{font-size:34px;font-weight:700}.stephead{font-size:17px;font-weight:700;letter-spacing:.3px}.body{font-size:14px;fill:#555d6b}.caption{font-size:13px;fill:#747b85}</style><text x="600" y="47" text-anchor="middle" class="maintitle">AGILE METHODOLOGY FOR IRONGRIND</text>
<defs><marker id="arr03" markerWidth="1.35" markerHeight="1.35" viewBox="0 -1 1.35 2" refX="1.15" refY="0" orient="auto" markerUnits="strokeWidth"><path d="M 0,-1 L 1.35,0 L 0,1 Z" fill="#9A66D8"/></marker><marker id="arr04" markerWidth="1.35" markerHeight="1.35" viewBox="0 -1 1.35 2" refX="1.15" refY="0" orient="auto" markerUnits="strokeWidth"><path d="M 0,-1 L 1.35,0 L 0,1 Z" fill="#EF476F"/></marker><marker id="arr05" markerWidth="1.35" markerHeight="1.35" viewBox="0 -1 1.35 2" refX="1.15" refY="0" orient="auto" markerUnits="strokeWidth"><path d="M 0,-1 L 1.35,0 L 0,1 Z" fill="#18B7B0"/></marker><marker id="arr06" markerWidth="1.35" markerHeight="1.35" viewBox="0 -1 1.35 2" refX="1.15" refY="0" orient="auto" markerUnits="strokeWidth"><path d="M 0,-1 L 1.35,0 L 0,1 Z" fill="#F3B642"/></marker><marker id="flow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#485366"/></marker></defs><circle cx="600" cy="238" r="114" fill="#fff" stroke="#e5eaf0" stroke-width="2"/><path d="M 495.35 133.35 A 148 148 0 0 1 704.65 133.35" fill="none" stroke="#9A66D8" stroke-width="68" stroke-linecap="butt" marker-end="url(#arr03)"/><path d="M 704.65 133.35 A 148 148 0 0 1 704.65 342.65" fill="none" stroke="#EF476F" stroke-width="68" stroke-linecap="butt" marker-end="url(#arr04)"/><path d="M 704.65 342.65 A 148 148 0 0 1 495.35 342.65" fill="none" stroke="#18B7B0" stroke-width="68" stroke-linecap="butt" marker-end="url(#arr05)"/><path d="M 495.35 342.65 A 148 148 0 0 1 495.35 133.35" fill="none" stroke="#F3B642" stroke-width="68" stroke-linecap="butt" marker-end="url(#arr06)"/><text x="600" y="226" class="center1" text-anchor="middle">AGILE</text><text x="600" y="260" class="center2" text-anchor="middle">IRON GRIND SYSTEM</text><text x="600" y="286" class="caption" text-anchor="middle">Iterative development cycle</text><text x="600" y="88" class="num" text-anchor="middle">03</text><text x="600" y="110" class="wlabel" text-anchor="middle">DEVELOP</text><text x="745" y="233" class="num" text-anchor="middle">04</text><text x="745" y="255" class="wlabel" text-anchor="middle">TEST</text><text x="600" y="378" class="num" text-anchor="middle">05</text><text x="600" y="400" class="wlabel" text-anchor="middle">DEPLOY</text><text x="455" y="233" class="num" text-anchor="middle">06</text><text x="455" y="255" class="wlabel" text-anchor="middle">REVIEW</text>
<polygon points="55,426 267,426 297,460 267,494 55,494 81,460" fill="#42C6D8"/><text x="176" y="467" class="ribbon" text-anchor="middle">01  PLAN</text><polygon points="321,426 533,426 563,460 533,494 321,494 347,460" fill="#6679D8"/><text x="442" y="467" class="ribbon" text-anchor="middle">02  DESIGN</text><polygon points="903,426 1115,426 1145,460 1115,494 903,494 929,460" fill="#69B43A"/><text x="1024" y="467" class="ribbon" text-anchor="middle">07  LAUNCH</text><path d="M 563 460 C 590 425 630 390 685 360" fill="none" stroke="#485366" stroke-width="4" marker-end="url(#flow)"/><path d="M 748 238 C 804 260 842 342 903 460" fill="none" stroke="#485366" stroke-width="4" marker-end="url(#flow)"/>
<g><text x="42" y="570" class="stepno" fill="#42C6D8">01</text><text x="90" y="569" class="stephead" fill="#42C6D8">PLAN</text><text x="90" y="595" class="body">Define gym workflows, users,</text><text x="90" y="616" class="body">requirements, and priorities.</text></g><g><text x="332" y="570" class="stepno" fill="#6679D8">02</text><text x="380" y="569" class="stephead" fill="#6679D8">DESIGN</text><text x="380" y="595" class="body">Plan pages, forms, data</text><text x="380" y="616" class="body">relationships, and permissions.</text></g><g><text x="622" y="570" class="stepno" fill="#9A66D8">03</text><text x="670" y="569" class="stephead" fill="#9A66D8">DEVELOP</text><text x="670" y="595" class="body">Build membership, attendance,</text><text x="670" y="616" class="body">inventory, sales, and reports.</text></g><g><text x="912" y="570" class="stepno" fill="#EF476F">04</text><text x="960" y="569" class="stephead" fill="#EF476F">TEST</text><text x="960" y="595" class="body">Check features and access;</text><text x="960" y="616" class="body">fix issues in each increment.</text></g><g><text x="187" y="730" class="stepno" fill="#18B7B0">05</text><text x="235" y="729" class="stephead" fill="#18B7B0">DEPLOY</text><text x="235" y="755" class="body">Configure the website and</text><text x="235" y="776" class="body">Supabase services for release.</text></g><g><text x="477" y="730" class="stepno" fill="#F3B642">06</text><text x="525" y="729" class="stephead" fill="#F3B642">REVIEW</text><text x="525" y="755" class="body">Review results and feedback;</text><text x="525" y="776" class="body">refine the next work priorities.</text></g><g><text x="767" y="730" class="stepno" fill="#69B43A">07</text><text x="815" y="729" class="stephead" fill="#69B43A">LAUNCH</text><text x="815" y="755" class="body">Release the approved system,</text><text x="815" y="776" class="body">orient staff, and begin use.</text></g><text x="600" y="875" class="caption" text-anchor="middle">Testing and review guide the next cycle; Launch follows the approved release.</text></svg>