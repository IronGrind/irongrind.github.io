<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">IronGrind Agile methodology infographic</title><desc id="description">A directional Agile workflow: Plan and Design lead to a clockwise iterative cycle of Develop, Test, Deploy, and Review, followed by Launch.</desc><rect width="1200" height="900" fill="#fff"/><style>text{font-family:Arial,sans-serif}.maintitle{font-size:30px;font-weight:700;letter-spacing:3px;fill:#20295a}.num{font-size:26px;font-weight:700;fill:#fff}.wlabel{font-size:13px;font-weight:700;fill:#fff}.center1{font-size:39px;font-weight:700;fill:#22295d}.center2{font-size:18px;fill:#424b63}.ribbon{font-size:18px;font-weight:700;fill:#fff}.stepno{font-size:34px;font-weight:700}.stephead{font-size:17px;font-weight:700;letter-spacing:.3px}.body{font-size:14px;fill:#555d6b}.caption{font-size:13px;fill:#747b85}</style><text x="600" y="47" text-anchor="middle" class="maintitle">AGILE METHODOLOGY FOR IRONGRIND</text>
<path d="M 489.59 122.38 A 165 165 0 0 1 696.98 111.51 L 693.69 151.31 L 658.78 164.1 A 100 100 0 0 0 533.09 170.69 Z" fill="#9A66D8" stroke="#fff" stroke-width="3"/><text x="593.07" y="107.68" class="num" text-anchor="middle">03</text><text x="593.07" y="129.68" class="wlabel" text-anchor="middle">DEVELOP</text><path d="M 722.62 134.59 A 165 165 0 0 1 733.49 341.98 L 693.69 338.69 L 680.9 303.78 A 100 100 0 0 0 674.31 178.09 Z" fill="#EF476F" stroke="#fff" stroke-width="3"/><text x="732.32" y="233.07" class="num" text-anchor="middle">04</text><text x="732.32" y="255.07" class="wlabel" text-anchor="middle">TEST</text><path d="M 710.41 367.62 A 165 165 0 0 1 503.02 378.49 L 506.31 338.69 L 541.22 325.9 A 100 100 0 0 0 666.91 319.31 Z" fill="#18B7B0" stroke="#fff" stroke-width="3"/><text x="606.93" y="372.32" class="num" text-anchor="middle">05</text><text x="606.93" y="394.32" class="wlabel" text-anchor="middle">DEPLOY</text><path d="M 477.38 355.41 A 165 165 0 0 1 466.51 148.02 L 506.31 151.31 L 519.1 186.22 A 100 100 0 0 0 525.69 311.91 Z" fill="#F3B642" stroke="#fff" stroke-width="3"/><text x="467.68" y="246.93" class="num" text-anchor="middle">06</text><text x="467.68" y="268.93" class="wlabel" text-anchor="middle">REVIEW</text><circle cx="600" cy="245" r="100" fill="#fff" stroke="#edf0f4" stroke-width="2"/><text x="600" y="237" class="center1" text-anchor="middle">AGILE</text><text x="600" y="270" class="center2" text-anchor="middle">IRON GRIND SYSTEM</text><text x="600" y="295" class="caption" text-anchor="middle">Iterative development cycle</text>
<polygon points="59,434 290,434 320,468 290,502 59,502 85,468" fill="#42C6D8"/><text x="185" y="475" class="ribbon" text-anchor="middle">01  PLAN</text><polygon points="344,434 575,434 605,468 575,502 344,502 370,468" fill="#6679D8"/><text x="470" y="475" class="ribbon" text-anchor="middle">02  DESIGN</text><polygon points="629,434 860,434 890,468 860,502 629,502 655,468" fill="#59677F"/><text x="755" y="475" class="ribbon" text-anchor="middle">03-06  ITERATE</text><polygon points="914,434 1145,434 1175,468 1145,502 914,502 940,468" fill="#69B43A"/><text x="1040" y="475" class="ribbon" text-anchor="middle">07  LAUNCH</text><defs><marker id="flow-arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#485366"/></marker></defs><path d="M 630 468 C 640 445 645 420 650 402" fill="none" stroke="#485366" stroke-width="4" marker-end="url(#flow-arrow)"/><path d="M 755 245 C 825 275 865 355 914 450" fill="none" stroke="#485366" stroke-width="4" marker-end="url(#flow-arrow)"/><g><text x="42" y="570" class="stepno" fill="#42C6D8">01</text><text x="90" y="569" class="stephead" fill="#42C6D8">PLAN</text><text x="90" y="595" class="body">Define gym workflows, users,</text><text x="90" y="616" class="body">requirements, and priorities.</text></g><g><text x="332" y="570" class="stepno" fill="#6679D8">02</text><text x="380" y="569" class="stephead" fill="#6679D8">DESIGN</text><text x="380" y="595" class="body">Plan pages, forms, data</text><text x="380" y="616" class="body">relationships, and permissions.</text></g><g><text x="622" y="570" class="stepno" fill="#9A66D8">03</text><text x="670" y="569" class="stephead" fill="#9A66D8">DEVELOP</text><text x="670" y="595" class="body">Build membership, attendance,</text><text x="670" y="616" class="body">inventory, sales, and reports.</text></g><g><text x="912" y="570" class="stepno" fill="#EF476F">04</text><text x="960" y="569" class="stephead" fill="#EF476F">TEST</text><text x="960" y="595" class="body">Check features and access;</text><text x="960" y="616" class="body">fix issues in each increment.</text></g><g><text x="187" y="730" class="stepno" fill="#18B7B0">05</text><text x="235" y="729" class="stephead" fill="#18B7B0">DEPLOY</text><text x="235" y="755" class="body">Configure the website and</text><text x="235" y="776" class="body">Supabase services for release.</text></g><g><text x="477" y="730" class="stepno" fill="#F3B642">06</text><text x="525" y="729" class="stephead" fill="#F3B642">REVIEW</text><text x="525" y="755" class="body">Review results and feedback;</text><text x="525" y="776" class="body">refine the next work priorities.</text></g><g><text x="767" y="730" class="stepno" fill="#69B43A">07</text><text x="815" y="729" class="stephead" fill="#69B43A">LAUNCH</text><text x="815" y="755" class="body">Release the approved system,</text><text x="815" y="776" class="body">orient staff, and begin use.</text></g><text x="600" y="875" class="caption" text-anchor="middle">Testing and review guide the next cycle; Launch follows the approved release.</text></svg>