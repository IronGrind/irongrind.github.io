<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">IronGrind Agile development methodology</title>
  <desc id="description">A five-stage iterative cycle: review Iron Grind workflows, prioritize improvements, design an increment, build and verify features, and review findings to refine the next cycle.</desc>
  <rect width="1200" height="900" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#4b5563"><path d="M 600 146 L 916 113" fill="none" stroke="#8b929b" stroke-width="2"/><circle cx="600" cy="146" r="4" fill="#27ae60"/><text x="930" y="105" text-anchor="start" font-size="18" font-weight="700" fill="#27ae60">Stage 1</text><text x="930" y="131" text-anchor="start" font-size="16">Map membership, attendance,</text><text x="930" y="153" text-anchor="start" font-size="16">inventory, sales, and reporting</text><text x="930" y="175" text-anchor="start" font-size="16">workflows as the starting point.</text></g>
  <g font-family="Arial, sans-serif" fill="#4b5563"><path d="M 879.6 349.1 L 916 443" fill="none" stroke="#8b929b" stroke-width="2"/><circle cx="879.6" cy="349.1" r="4" fill="#3498db"/><text x="930" y="435" text-anchor="start" font-size="18" font-weight="700" fill="#3498db">Stage 2</text><text x="930" y="461" text-anchor="start" font-size="16">Select improvements with</text><text x="930" y="483" text-anchor="start" font-size="16">gym stakeholders and prioritize</text><text x="930" y="505" text-anchor="start" font-size="16">the requirements for each cycle.</text></g>
  <g font-family="Arial, sans-serif" fill="#4b5563"><path d="M 772.8 677.9 L 600 778" fill="none" stroke="#8b929b" stroke-width="2"/><circle cx="772.8" cy="677.9" r="4" fill="#34495e"/><text x="600" y="770" text-anchor="middle" font-size="18" font-weight="700" fill="#34495e">Stage 3</text><text x="600" y="796" text-anchor="middle" font-size="16">Shape pages, forms, and data</text><text x="600" y="818" text-anchor="middle" font-size="16">flows around the agreed</text><text x="600" y="840" text-anchor="middle" font-size="16">IronGrind requirements.</text></g>
  <g font-family="Arial, sans-serif" fill="#4b5563"><path d="M 427.2 677.9 L 284 598" fill="none" stroke="#8b929b" stroke-width="2"/><circle cx="427.2" cy="677.9" r="4" fill="#f0442e"/><text x="270" y="590" text-anchor="end" font-size="18" font-weight="700" fill="#f0442e">Stage 4</text><text x="270" y="616" text-anchor="end" font-size="16">Develop and check features</text><text x="270" y="638" text-anchor="end" font-size="16">such as applications, QR</text><text x="270" y="660" text-anchor="end" font-size="16">attendance, sales, and reports.</text></g>
  <g font-family="Arial, sans-serif" fill="#4b5563"><path d="M 320.4 349.1 L 284 168" fill="none" stroke="#8b929b" stroke-width="2"/><circle cx="320.4" cy="349.1" r="4" fill="#f39c12"/><text x="270" y="160" text-anchor="end" font-size="18" font-weight="700" fill="#f39c12">Stage 5</text><text x="270" y="186" text-anchor="end" font-size="16">Use verification and review</text><text x="270" y="208" text-anchor="end" font-size="16">findings to refine the next</text><text x="270" y="230" text-anchor="end" font-size="16">development cycle.</text></g>
  <path d="M 437.8 199.6 A 290 290 0 0 1 762.2 199.6 L 688.4 309 A 158 158 0 0 0 511.6 309 Z" fill="#27ae60" stroke="#fff" stroke-width="7"/>
  <path d="M 778.5 211.5 A 290 290 0 0 1 878.8 519.9 L 751.9 483.6 A 158 158 0 0 0 697.3 315.5 Z" fill="#3498db" stroke="#fff" stroke-width="7"/>
  <path d="M 872.5 539.2 A 290 290 0 0 1 610.1 729.8 L 605.5 597.9 A 158 158 0 0 0 748.5 494 Z" fill="#34495e" stroke="#fff" stroke-width="7"/>
  <path d="M 589.9 729.8 A 290 290 0 0 1 327.5 539.2 L 451.5 494 A 158 158 0 0 0 594.5 597.9 Z" fill="#f0442e" stroke="#fff" stroke-width="7"/>
  <path d="M 321.2 519.9 A 290 290 0 0 1 421.5 211.5 L 502.7 315.5 A 158 158 0 0 0 448.1 483.6 Z" fill="#f39c12" stroke="#fff" stroke-width="7"/>
  <circle cx="600" cy="440" r="153" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="600" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#3498db">AGILE</text>
  <text x="600" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#374151">IronGrind</text>
  <text x="600" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#6b7280">Development Cycle</text>
  <g text-anchor="middle" font-family="Arial, sans-serif" fill="#fff"><text x="600" y="202" font-size="35" font-weight="700">1</text><text x="600" y="232" font-size="17" font-weight="700">Review Iron Grind</text><text x="600" y="254" font-size="17" font-weight="700">workflows</text></g>
  <g text-anchor="middle" font-family="Arial, sans-serif" fill="#fff"><text x="809.2" y="354" font-size="35" font-weight="700">2</text><text x="809.2" y="384" font-size="17" font-weight="700">Prioritize</text><text x="809.2" y="406" font-size="17" font-weight="700">improvements</text></g>
  <g text-anchor="middle" font-family="Arial, sans-serif" fill="#fff"><text x="729.3" y="600" font-size="35" font-weight="700">3</text><text x="729.3" y="630" font-size="17" font-weight="700">Design the</text><text x="729.3" y="652" font-size="17" font-weight="700">selected increment</text></g>
  <g text-anchor="middle" font-family="Arial, sans-serif" fill="#fff"><text x="470.7" y="600" font-size="35" font-weight="700">4</text><text x="470.7" y="630" font-size="17" font-weight="700">Build and verify</text><text x="470.7" y="652" font-size="17" font-weight="700">system features</text></g>
  <g text-anchor="middle" font-family="Arial, sans-serif" fill="#fff"><text x="390.8" y="354" font-size="35" font-weight="700">5</text><text x="390.8" y="384" font-size="17" font-weight="700">Review and</text><text x="390.8" y="406" font-size="17" font-weight="700">refine</text></g>
  <text x="600" y="885" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Each cycle produces a reviewed increment and informs the next iteration.</text>
</svg>
