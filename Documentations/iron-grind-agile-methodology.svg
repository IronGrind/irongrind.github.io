<svg xmlns="http://www.w3.org/2000/svg" width="900" height="648" viewBox="0 0 1000 720" role="img" aria-labelledby="title description">
  <title id="title">Agile methodology for IronGrind</title>
  <desc id="description">The project flow moves from gathering requirements to planning, design, and launch after verification. During development, the team repeats the Develop, Test, and Review cycle, using feedback to improve the next increment.</desc>
  <defs>
    <marker id="arrow-develop" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L18,9 L0,18 z" fill="#4f78b8" />
    </marker>
    <marker id="arrow-test" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L18,9 L0,18 z" fill="#dda928" />
    </marker>
    <marker id="arrow-review" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L18,9 L0,18 z" fill="#cf4034" />
    </marker>
  </defs>

  <rect width="1000" height="720" fill="#f1f4f3" />
  <text x="42" y="55" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#20242b">AGILE</text>
  <text x="42" y="98" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#20242b">METHODOLOGY</text>

  <circle cx="500" cy="330" r="150" fill="none" stroke="#e3e7e5" stroke-width="34" />
  <path d="M526,182 A150,150 0 0 1 623,416" fill="none" stroke="#4f78b8" stroke-width="30" marker-end="url(#arrow-develop)" />
  <path d="M596,445 A150,150 0 0 1 364,394" fill="none" stroke="#dda928" stroke-width="30" marker-end="url(#arrow-test)" />
  <path d="M352,356 A150,150 0 0 1 487,181" fill="none" stroke="#cf4034" stroke-width="30" marker-end="url(#arrow-review)" />

  <circle cx="500" cy="330" r="102" fill="#ffffff" stroke="#d9deda" stroke-width="2" />
  <text x="500" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="27" fill="#30343b">IronGrind</text>
  <text x="500" y="349" text-anchor="middle" font-family="Georgia, serif" font-size="25" fill="#30343b">Agile Cycle</text>

  <text x="700" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#365f9e">DEVELOP</text>
  <text x="700" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#344054">Build an increment</text>
  <text x="500" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#8e6810">TEST</text>
  <text x="500" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#344054">Check it against requirements</text>
  <text x="300" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b92f28">REVIEW</text>
  <text x="300" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#344054">Use feedback to refine</text>

  <text x="45" y="580" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#344054">PROJECT FLOW</text>
  <path d="M40,598 H260 L288,630 L260,662 H40 Z" fill="#35a68c" />
  <path d="M270,598 H490 L518,630 L490,662 H270 L298,630 Z" fill="#4f78b8" />
  <path d="M500,598 H720 L748,630 L720,662 H500 L528,630 Z" fill="#357d88" />
  <path d="M730,598 H950 L978,630 L950,662 H730 L758,630 Z" fill="#e0b02e" />
  <g text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="155" y="636" fill="#ffffff">Data Gathering</text>
    <text x="385" y="636" fill="#ffffff">Plan</text>
    <text x="615" y="636" fill="#ffffff">Design</text>
    <text x="845" y="636" fill="#20242b">Launch</text>
  </g>
  <text x="500" y="696" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#344054">IronGrind work: applications and renewals | staff QR attendance | inventory and sales | reports</text>
</svg>
