<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1430" viewBox="0 0 1700 1430" role="img" aria-labelledby="title desc">
<title id="title">Iron Grind System Architecture Diagram</title>
<desc id="desc">Role based login leads to six aligned Iron Grind system modules. Each module shows its service operations and data exchanged with Supabase Data API and PostgreSQL, with authentication, security, staff account creation, and Realtime scope.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#343a46"/></marker>
  <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7d8797"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#17202b}
    .title{font-size:23px;font-weight:700;letter-spacing:.35px}
    .section{font-size:13px;font-weight:700;letter-spacing:.5px}
    .head{font-size:14px;font-weight:700}
    .body{font-size:11px}
    .small{font-size:10px}
    .tiny{font-size:9px}
    .box{fill:#fff;stroke:#46505e;stroke-width:1.5}
    .soft{fill:#f2f4f7;stroke:#697383;stroke-width:1.3}
    .module{fill:#fff;stroke:#46505e;stroke-width:1.3}
    .service{fill:#f7f8fa;stroke:#929baa;stroke-width:1.2}
    .api{fill:#edf1f5;stroke:#384250;stroke-width:1.6}
    .solid{fill:none;stroke:#343a46;stroke-width:1.5;marker-end:url(#arrow)}
    .response{fill:none;stroke:#7d8797;stroke-width:1.35;stroke-dasharray:5 4;marker-end:url(#arrowMuted)}
    .plain{fill:none;stroke:#687281;stroke-width:1.3}
    .red{fill:#9d1010}
  </style>
</defs>
<rect width="1700" height="1430" fill="#fff"/>
<text x="850" y="34" text-anchor="middle" class="title">IRON GRIND FITNESS GYM MEMBERSHIP &amp; OPERATIONS MANAGEMENT SYSTEM</text>
<text x="850" y="57" text-anchor="middle" class="section">SYSTEM ARCHITECTURE</text>

<!-- Actors, login, authentication, and system role routing -->
<g transform="translate(180 77)"><circle cx="18" cy="15" r="13" fill="#111820"/><path d="M0 62c1-19 7-29 18-29s17 10 18 29z" fill="#111820"/><text x="18" y="83" text-anchor="middle" class="small">Member / Applicant</text></g>
<g transform="translate(1485 77)"><circle cx="18" cy="15" r="13" fill="#111820"/><path d="M0 62c1-19 7-29 18-29s17 10 18 29z" fill="#111820"/><rect x="23" y="44" width="30" height="23" rx="3" fill="#fff" stroke="#111820" stroke-width="3"/><path d="M31 44v-6h14v6" fill="none" stroke="#111820" stroke-width="3"/><text x="27" y="83" text-anchor="middle" class="small">Administrator / Staff</text></g>
<rect x="700" y="77" width="300" height="68" rx="9" class="soft"/>
<rect x="733" y="91" width="38" height="38" rx="5" fill="#fff" stroke="#46505e" stroke-width="1.5"/><rect x="738" y="96" width="28" height="5" rx="2" fill="#9d1010"/><path d="M739 106h26M739 112h20M739 118h24" stroke="#8791a0" stroke-width="2"/>
<text x="867" y="105" text-anchor="middle" class="head">Login Page</text>
<text x="867" y="126" text-anchor="middle" class="small">index.html</text>
<path d="M225 111H690" class="solid"/><text x="470" y="101" text-anchor="middle" class="small">User input</text>
<path d="M1485 111H1010" class="solid"/><text x="1245" y="101" text-anchor="middle" class="small">Admin input</text>
<rect x="700" y="177" width="300" height="62" rx="9" class="box"/>
<path d="M839 194v-5a11 11 0 0 1 22 0v5" fill="none" stroke="#137bc1" stroke-width="4"/><rect x="835" y="194" width="30" height="23" rx="5" fill="#168bd2"/><circle cx="850" cy="204" r="3" fill="#fff"/><path d="M850 207v5" stroke="#fff" stroke-width="2"/>
<text x="850" y="231" text-anchor="middle" class="small">Supabase Auth - credential verification and session</text>
<path d="M850 145V169" class="solid"/><text x="864" y="162" class="tiny">credentials</text>
<path d="M720 177H670V111H690" class="response"/><text x="658" y="153" text-anchor="end" class="tiny">authentication result / error</text>
<rect x="675" y="269" width="350" height="62" rx="9" class="soft"/>
<rect x="704" y="282" width="38" height="26" rx="3" fill="#e8f8fd" stroke="#10a9c7" stroke-width="3"/><path d="M723 308v7m-11 0h22" stroke="#10a9c7" stroke-width="3" stroke-linecap="round"/>
<text x="877" y="294" text-anchor="middle" class="head">Iron Grind System</text>
<text x="877" y="314" text-anchor="middle" class="small">Successful login - load profiles.role by Auth user ID</text>
<path d="M850 239V261" class="solid"/><text x="863" y="255" class="tiny">successful login</text>
<rect x="190" y="358" width="540" height="62" rx="9" class="box"/>
<text x="460" y="383" text-anchor="middle" class="head">Member session</text>
<text x="460" y="403" text-anchor="middle" class="small">role = member - match members.auth_user_id - member experience / application status</text>
<rect x="970" y="358" width="540" height="62" rx="9" class="box"/>
<text x="1240" y="383" text-anchor="middle" class="head">Administrator session</text>
<text x="1240" y="403" text-anchor="middle" class="small">profile.role = admin - open admin.html operations dashboard</text>
<path d="M675 299H460V350" class="solid"/><text x="548" y="291" text-anchor="middle" class="tiny">role = member</text>
<path d="M1025 299H1240V350" class="solid"/><text x="1157" y="291" text-anchor="middle" class="tiny">role = admin</text>
<rect x="105" y="440" width="1490" height="55" rx="8" class="soft"/>
<text x="850" y="462" text-anchor="middle" class="head">Registration and staff account creation</text>
<text x="850" y="482" text-anchor="middle" class="small">Online: register.html - Auth signUp() - profiles row via Auth trigger - pending membership_applications after confirmation. Staff-created: admin-create-member Edge Function - Auth Admin API - admin_create_member_and_sale RPC.</text>
<!-- Role-authorized session bus -->
<path d="M460 420V526H80M1240 420V526H1620M80 526H1620" class="plain"/>
<text x="850" y="518" text-anchor="middle" class="small">Role-authorized session · pages below show the six main system modules</text>

<!-- Module 1 -->
<path d="M155 526V548" class="solid"/>
<rect x="25" y="553" width="260" height="70" rx="8" class="module"/>
<text x="155" y="580" text-anchor="middle" class="head">Applications &amp; Membership</text>
<text x="155" y="602" text-anchor="middle" class="small">register.html · admin.html</text>
<rect x="25" y="634" width="260" height="299" rx="8" class="service"/>
<text x="155" y="659" text-anchor="middle" class="section">APPLICATIONS SERVICE</text>
<text x="42" y="687" class="body">• Submit registration application</text>
<text x="42" y="710" class="body">• Review, approve, or reject</text>
<text x="42" y="733" class="body">• Create / update member record</text>
<text x="42" y="756" class="body">• Record registration sale</text>
<text x="42" y="791" class="small">DATA REQUESTS</text>
<text x="42" y="812" class="small">membership_applications INSERT</text>
<text x="42" y="831" class="small">members INSERT / UPDATE</text>
<text x="42" y="850" class="small">sales + sale_items via RPC</text>
<text x="42" y="869" class="small">membership_applications UPDATE</text>
<text x="42" y="902" class="tiny">Returns application / member result</text>

<!-- Module 2 -->
<path d="M435 526V548" class="solid"/>
<rect x="305" y="553" width="260" height="70" rx="8" class="module"/>
<text x="435" y="580" text-anchor="middle" class="head">Attendance / QR</text>
<text x="435" y="602" text-anchor="middle" class="small">admin.html · customer.html</text>
<rect x="305" y="634" width="260" height="299" rx="8" class="service"/>
<text x="435" y="659" text-anchor="middle" class="section">ATTENDANCE SERVICE</text>
<text x="322" y="687" class="body">• Resolve QR / member lookup</text>
<text x="322" y="710" class="body">• Record time-in check-in</text>
<text x="322" y="733" class="body">• Record time-out check-out</text>
<text x="322" y="756" class="body">• Read attendance history</text>
<text x="322" y="791" class="small">DATA REQUESTS</text>
<text x="322" y="812" class="small">members SELECT</text>
<text x="322" y="831" class="small">attendance INSERT (time-in)</text>
<text x="322" y="850" class="small">attendance UPDATE (time-out)</text>
<text x="322" y="869" class="small">attendance SELECT</text>
<text x="322" y="902" class="tiny">Returns check-in / history result</text>

<!-- Module 3 -->
<path d="M715 526V548" class="solid"/>
<rect x="585" y="553" width="260" height="70" rx="8" class="module"/>
<text x="715" y="580" text-anchor="middle" class="head">Inventory &amp; Products</text>
<text x="715" y="602" text-anchor="middle" class="small">admin.html · read-only member catalog</text>
<rect x="585" y="634" width="260" height="299" rx="8" class="service"/>
<text x="715" y="659" text-anchor="middle" class="section">INVENTORY SERVICE</text>
<text x="602" y="687" class="body">• Create / edit product details</text>
<text x="602" y="710" class="body">• Manage product stock</text>
<text x="602" y="733" class="body">• Read active member catalog</text>
<text x="602" y="791" class="small">DATA REQUESTS</text>
<text x="602" y="812" class="small">products SELECT (lookup)</text>
<text x="602" y="831" class="small">products INSERT / UPDATE</text>
<text x="602" y="850" class="small">products SELECT (active catalog)</text>
<text x="602" y="902" class="tiny">Returns product / stock result</text>

<!-- Module 4 -->
<path d="M995 526V548" class="solid"/>
<rect x="865" y="553" width="260" height="70" rx="8" class="module"/>
<text x="995" y="580" text-anchor="middle" class="head">Walk-in POS / Receipts</text>
<text x="995" y="602" text-anchor="middle" class="small">Staff-entered product sale</text>
<rect x="865" y="634" width="260" height="299" rx="8" class="service"/>
<text x="995" y="659" text-anchor="middle" class="section">SALES SERVICE · RPC</text>
<text x="882" y="687" class="body">• Call record_walk_in_sale()</text>
<text x="882" y="710" class="body">• Validate product and stock</text>
<text x="882" y="733" class="body">• Save receipt and sale lines</text>
<text x="882" y="756" class="body">• Decrement merchandise stock</text>
<text x="882" y="791" class="small">DATA REQUESTS</text>
<text x="882" y="812" class="small">products SELECT / UPDATE</text>
<text x="882" y="831" class="small">sales INSERT receipt</text>
<text x="882" y="850" class="small">sale_items INSERT lines</text>
<text x="882" y="902" class="tiny">Returns receipt result</text>

<!-- Module 5 -->
<path d="M1275 526V548" class="solid"/>
<rect x="1145" y="553" width="260" height="70" rx="8" class="module"/>
<text x="1275" y="580" text-anchor="middle" class="head">Member Portal</text>
<text x="1275" y="602" text-anchor="middle" class="small">customer.html</text>
<rect x="1145" y="634" width="260" height="299" rx="8" class="service"/>
<text x="1275" y="659" text-anchor="middle" class="section">MEMBER DATA SERVICE</text>
<text x="1162" y="687" class="body">• View own membership / visits</text>
<text x="1162" y="710" class="body">• View active product catalog</text>
<text x="1162" y="733" class="body">• Submit renewal application</text>
<text x="1162" y="756" class="body">• Update personal information</text>
<text x="1162" y="791" class="small">DATA REQUESTS</text>
<text x="1162" y="812" class="small">own members / attendance SELECT</text>
<text x="1162" y="831" class="small">active products SELECT</text>
<text x="1162" y="850" class="small">membership_applications INSERT</text>
<text x="1162" y="869" class="small">personal information RPC</text>
<text x="1162" y="902" class="tiny">Returns member / portal result</text>

<!-- Module 6 -->
<path d="M1555 526V548" class="solid"/>
<rect x="1425" y="553" width="260" height="70" rx="8" class="module"/>
<text x="1555" y="580" text-anchor="middle" class="head">Reports &amp; Exports</text>
<text x="1555" y="602" text-anchor="middle" class="small">admin.html · authorized queries</text>
<rect x="1425" y="634" width="260" height="299" rx="8" class="service"/>
<text x="1555" y="659" text-anchor="middle" class="section">REPORT QUERY SERVICE</text>
<text x="1442" y="687" class="body">• Apply frontend date / filters</text>
<text x="1442" y="710" class="body">• Build dashboard summaries</text>
<text x="1442" y="733" class="body">• Generate report / export output</text>
<text x="1442" y="791" class="small">DATA REQUESTS</text>
<text x="1442" y="812" class="small">members / applications SELECT</text>
<text x="1442" y="831" class="small">attendance date SELECT</text>
<text x="1442" y="850" class="small">products / sales / sale_items SELECT</text>
<text x="1442" y="869" class="small">membership_history SELECT</text>
<text x="1442" y="902" class="tiny">Returns query / report results</text>

<!-- Requests and responses share six aligned lanes -->
<path d="M139 933V1000" class="solid"/><path d="M161 1000V933" class="response"/>
<path d="M419 933V1000" class="solid"/><path d="M441 1000V933" class="response"/>
<path d="M699 933V1000" class="solid"/><path d="M721 1000V933" class="response"/>
<path d="M979 933V1000" class="solid"/><path d="M1001 1000V933" class="response"/>
<path d="M1259 933V1000" class="solid"/><path d="M1281 1000V933" class="response"/>
<path d="M1539 933V1000" class="solid"/><path d="M1561 1000V933" class="response"/>
<text x="850" y="985" text-anchor="middle" class="tiny">Solid arrows: requests / records saved · Dashed arrows: query results / responses</text>

<!-- Security and server-side operations -->
<rect x="35" y="1005" width="1630" height="112" rx="9" class="api"/>
<text x="850" y="1031" text-anchor="middle" class="head">SUPABASE DATA API / RPC · ROW LEVEL SECURITY (RLS)</text>
<text x="850" y="1054" text-anchor="middle" class="small">Browser table requests carry the signed-in user's Auth session; RLS policies restrict direct table access.</text>
<text x="850" y="1074" text-anchor="middle" class="small">RPC functions enforce their own authorization and validation checks.</text>
<text x="850" y="1094" text-anchor="middle" class="small">Staff account creation uses admin-create-member Edge Function: verify admin → Auth Admin API → privileged member-creation RPC.</text>

<!-- Realtime scope -->
<rect x="1230" y="1133" width="435" height="65" rx="8" class="soft"/>
<text x="1447" y="1157" text-anchor="middle" class="small">SUPABASE REALTIME</text>
<text x="1447" y="1175" text-anchor="middle" class="tiny">Publication: applications + attendance; not members.</text>

<!-- Shared database -->
<path d="M850 1117V1190" class="solid"/>
<ellipse cx="850" cy="1212" rx="330" ry="32" fill="#121820"/>
<path d="M520 1212V1332C520 1350 668 1368 850 1368S1180 1350 1180 1332V1212" fill="#121820"/>
<ellipse cx="850" cy="1332" rx="330" ry="32" fill="#121820"/>
<text x="850" y="1208" text-anchor="middle" style="fill:#fff;font-size:19px;font-weight:700">SUPABASE POSTGRESQL</text>
<text x="850" y="1248" text-anchor="middle" style="fill:#fff;font-size:12px">Shared system database</text>
<text x="850" y="1271" text-anchor="middle" style="fill:#fff;font-size:11px">profiles · members · membership_applications · attendance</text>
<text x="850" y="1294" text-anchor="middle" style="fill:#fff;font-size:11px">products · sales · sale_items · membership_history</text>
<text x="850" y="1402" text-anchor="middle" class="title">Figure 3. System Architecture Diagram</text>
</svg>