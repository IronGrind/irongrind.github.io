<text x="460" y="403" text-anchor="middle" class="small">role = member - match members.auth_user_id - member experience / application status</text>
<rect x="970" y="358" width="540" height="62" rx="9" class="box"/>
<text x="1240" y="383" text-anchor="middle" class="head">Administrator session</text>
<text x="1240" y="403" text-anchor="middle" class="small">profile.role = admin - open admin.html operations dashboard</text>
<path d="M675 299H460V350" class="solid"/><text x="548" y="291" text-anchor="middle" class="tiny">role = member</text>
<path d="M1025 299H1240V350" class="solid"/><text x="1157" y="291" text-anchor="middle" class="tiny">role = admin</text>
<rect x="105" y="435" width="720" height="80" rx="8" class="soft"/>
<text x="465" y="456" text-anchor="middle" class="head">Applicant Registration</text>
<text x="465" y="477" text-anchor="middle" class="small">register.html → Supabase Auth signUp() → profile created</text>
<text x="465" y="497" text-anchor="middle" class="small">Success / confirmation → membership application saved as Pending</text>
<rect x="875" y="440" width="720" height="55" rx="8" class="soft"/>
<text x="1235" y="462" text-anchor="middle" class="head">Admin Creates Member Account</text>
