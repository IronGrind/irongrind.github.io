<!-- Security and server-side operations -->
<rect x="35" y="1005" width="1630" height="112" rx="9" class="api"/>
<text x="850" y="1031" text-anchor="middle" class="head">SUPABASE DATA API / RPC + ROW LEVEL SECURITY (RLS)</text>
<text x="850" y="1054" text-anchor="middle" class="small">Browser table requests carry the signed-in user's Auth session; RLS policies restrict direct table access.</text>
<text x="850" y="1074" text-anchor="middle" class="small">RPC functions enforce their own authorization and validation checks.</text>
<text x="850" y="1094" text-anchor="middle" class="small">Admin verified → Auth account + member record</text>

<!-- Realtime scope -->
<rect x="35" y="1127" width="450" height="82" rx="8" class="soft"/>
<text x="55" y="1145" class="small" style="font-weight:700">LINE KEY</text>
<path d="M55 1158H100" class="solid"/><text x="115" y="1161" class="tiny">Request / data write</text>
<path d="M55 1177H100" class="response"/><text x="115" y="1180" class="tiny">Response / query result</text>
<path d="M55 1196H100" class="plain"/><text x="115" y="1199" class="tiny">Session / page routing</text>
<rect x="1230" y="1133" width="435" height="65" rx="8" class="soft"/>
<text x="1447" y="1153" text-anchor="middle" class="small">SUPABASE REALTIME</text>
<text x="1447" y="1171" text-anchor="middle" class="tiny">Publication: membership_applications + attendance.</text>
<text x="1447" y="1187" text-anchor="middle" class="tiny">members is not enabled.</text>

<!-- Shared database -->
<path d="M850 1117V1190" class="solid"/>
<ellipse cx="850" cy="1212" rx="330" ry="32" fill="#121820"/>
<path d="M520 1212V1332C520 1350 668 1368 850 1368S1180 1350 1180 1332V1212" fill="#121820"/>
<ellipse cx="850" cy="1332" rx="330" ry="32" fill="#121820"/>
<text x="850" y="1208" text-anchor="middle" style="fill:#fff;font-size:19px;font-weight:700">SUPABASE POSTGRESQL</text>
<text x="850" y="1248" text-anchor="middle" style="fill:#fff;font-size:12px">Shared system database</text>
<text x="850" y="1271" text-anchor="middle" style="fill:#fff;font-size:11px">profiles, members, membership_applications, attendance</text>
<text x="850" y="1294" text-anchor="middle" style="fill:#fff;font-size:11px">products, sales, sale_items, membership_history</text>
