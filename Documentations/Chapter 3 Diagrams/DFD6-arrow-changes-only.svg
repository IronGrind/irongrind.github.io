<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#26734d"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#b42318"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #17212b; }
      .title { font-size: 27px; font-weight: 700; }
      .heading { font-size: 19px; font-weight: 700; }
      .label { font-size: 16px; }
      .small { font-size: 14px; }
      .proc { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 2; rx: 12; }
      .store { fill: #d5e8d4; stroke: #82b366; stroke-width: 2; }
      .actor { fill: #fff2cc; stroke: #d6b656; stroke-width: 2; rx: 18; }
      .new { fill: none; stroke: #26734d; stroke-width: 3; marker-end: url(#arrow); }
      .old { fill: none; stroke: #b42318; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#redArrow); }
    </style>
  </defs>
  <rect width="1200" height="860" fill="#ffffff"/>
  <text x="48" y="52" class="title">DFD 6 — Arrow changes only</text>
  <text x="48" y="82" class="small">This is a focused correction sketch; keep the rest of the DFD unchanged.</text>

  <rect x="48" y="115" width="1104" height="190" rx="14" fill="#fff7f6" stroke="#e5a09b"/>
  <text x="72" y="150" class="heading" fill="#8b1e16">REMOVE the misleading chain labelled “Activity logs”</text>
  <rect x="92" y="184" width="170" height="60" class="proc"/><text x="177" y="221" text-anchor="middle" class="label">Renewals (4.0)</text>
  <rect x="365" y="184" width="170" height="60" class="proc"/><text x="450" y="221" text-anchor="middle" class="label">Attendance (5.0)</text>
  <rect x="638" y="184" width="190" height="60" class="proc"/><text x="733" y="221" text-anchor="middle" class="label">Inventory (6.0)</text>
  <rect x="930" y="184" width="150" height="60" class="proc"/><text x="1005" y="221" text-anchor="middle" class="label">Sales (7.0)</text>
  <path d="M262 214 H365 M535 214 H638 M828 214 H930" class="old"/>
  <path d="M248 193 l18 42 M266 193 l-18 42 M521 193 l18 42 M539 193 l-18 42 M814 193 l18 42 M832 193 l-18 42" stroke="#b42318" stroke-width="4"/>
  <text x="72" y="278" class="small">These processes should not pass audit logs from one process to the next.</text>

  <rect x="48" y="335" width="1104" height="470" rx="14" fill="#f7fbf8" stroke="#a6c9b4"/>
  <text x="72" y="372" class="heading" fill="#205c3e">ADD / ROUTE the audit-log flows like this</text>

  <rect x="88" y="423" width="325" height="190" class="proc"/>
  <text x="250" y="461" text-anchor="middle" class="heading">Processes that perform actions</text>
  <text x="250" y="496" text-anchor="middle" class="label">2.0 Membership Application</text>
  <text x="250" y="526" text-anchor="middle" class="label">3.0 User Management · 4.0 Renewals</text>
  <text x="250" y="556" text-anchor="middle" class="label">5.0 Attendance · 6.0 Inventory</text>
  <text x="250" y="586" text-anchor="middle" class="label">7.0 Sales · 8.0 Reports (if logged)</text>

  <path d="M413 518 H572" class="new"/>
  <text x="492" y="496" text-anchor="middle" class="small">Audit event</text>
  <ellipse cx="665" cy="518" rx="94" ry="57" class="store"/>
  <text x="665" y="512" text-anchor="middle" class="heading">D9</text>
  <text x="665" y="538" text-anchor="middle" class="small">activity_logs</text>

  <path d="M759 518 H856" class="new"/>
  <text x="806" y="496" text-anchor="middle" class="small">Filtered records</text>
  <rect x="858" y="478" width="150" height="80" class="proc"/>
  <text x="933" y="511" text-anchor="middle" class="heading">9.0</text>
  <text x="933" y="536" text-anchor="middle" class="small">Activity Logs</text>

  <rect x="1008" y="658" width="112" height="58" class="actor"/>
  <text x="1064" y="694" text-anchor="middle" class="label">Admin</text>
  <path d="M1064 658 V584 H1008" class="new"/>
  <text x="1051" y="615" text-anchor="end" class="small">Filters / page query</text>
  <path d="M1008 541 H1064 V658" class="new"/>
  <text x="1083" y="592" class="small">Results</text>

  <rect x="72" y="678" width="850" height="78" rx="10" fill="#ffffff" stroke="#d2d9df"/>
  <text x="92" y="709" class="small">Keep the existing Admin → 9.0 filters and 9.0 → Admin filtered-results arrows.</text>
  <text x="92" y="735" class="small">The read path should be D9 → 9.0; action processes write audit events to D9.</text>
</svg>
