<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#26734d"/>
    </marker>
    <marker id="badarr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b42318"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #1d2733; }
      .title { font-size: 27px; font-weight: 700; }
      .head { font-size: 20px; font-weight: 700; }
      .label { font-size: 16px; }
      .small { font-size: 14px; }
      .proc { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 2; rx: 12; }
      .store { fill: #d5e8d4; stroke: #82b366; stroke-width: 2; }
      .actor { fill: #fff2cc; stroke: #d6b656; stroke-width: 2; rx: 18; }
      .good { fill: none; stroke: #26734d; stroke-width: 3; marker-end: url(#arr); }
      .bad { fill: none; stroke: #b42318; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#badarr); }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#fff"/>
  <text x="48" y="52" class="title">DFD 6 — Membership approval arrows only</text>
  <text x="48" y="82" class="small">Focused correction sketch; keep the other DFD flows unchanged.</text>

  <rect x="55" y="265" width="150" height="72" class="actor"/>
  <text x="130" y="308" text-anchor="middle" class="head">Admin</text>

  <rect x="385" y="235" width="300" height="130" class="proc"/>
  <text x="535" y="280" text-anchor="middle" class="head">2.0 Membership Application</text>
  <text x="535" y="313" text-anchor="middle" class="label">Reviews decision and updates records</text>

  <ellipse cx="935" cy="235" rx="145" ry="62" class="store"/>
  <text x="935" y="230" text-anchor="middle" class="head">D2</text>
  <text x="935" y="255" text-anchor="middle" class="label">Applications</text>

  <ellipse cx="935" cy="410" rx="145" ry="62" class="store"/>
  <text x="935" y="405" text-anchor="middle" class="head">D3</text>
  <text x="935" y="430" text-anchor="middle" class="label">Members</text>

  <path d="M205 301 H385" class="good"/>
  <text x="295" y="282" text-anchor="middle" class="label">Review decision</text>

  <path d="M685 270 H790" class="good"/>
  <text x="738" y="247" text-anchor="middle" class="small">Status / decision</text>
  <path d="M685 330 H790 V410" class="good"/>
  <text x="746" y="365" text-anchor="middle" class="small">Approved member record</text>

  <rect x="55" y="520" width="510" height="105" rx="12" fill="#fff7f6" stroke="#e5a09b" stroke-width="2"/>
  <text x="80" y="555" class="head" fill="#8b1e16">REMOVE this incorrect flow</text>
  <text x="80" y="585" class="label">D6 (sales data) → 2.0 “Approve member record”</text>
  <text x="80" y="610" class="small">The sales store is not the source of an approval decision.</text>

  <rect x="625" y="520" width="520" height="105" rx="12" fill="#f7fbf8" stroke="#a6c9b4" stroke-width="2"/>
  <text x="650" y="555" class="head" fill="#205c3e">KEEP the existing sales flows</text>
  <text x="650" y="585" class="label">D6 stays connected to Sales (7.0) for transactions.</text>
  <text x="650" y="610" class="small">The approval process uses D2 and D3 instead.</text>
</svg>
