<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="760" viewBox="0 0 2200 760" role="img" aria-labelledby="title desc">
  <title id="title">IronGrind system context diagram</title>
  <desc id="desc">Member and applicant, administrator, and authorized staff exchange role-specific information with the IronGrind Membership and Operations Management System.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#53677f"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #182536; }
      .actor { fill: #d8e4f5; stroke: #53677f; stroke-width: 3; }
      .system { fill: #fff; stroke: #53677f; stroke-width: 3; }
      .header { fill: #d8e4f5; stroke: #53677f; stroke-width: 3; }
      .flow { fill: none; stroke: #53677f; stroke-width: 3; marker-end: url(#arrow); }
      .actor-label { font-size: 24px; font-weight: 700; text-anchor: middle; }
      .system-label { font-size: 25px; font-weight: 700; text-anchor: middle; }
      .number { font-size: 22px; text-anchor: middle; }
      .flow-label { font-size: 18px; }
      .note { font-size: 16px; fill: #36485d; }
    </style>
  </defs>
  <rect width="2200" height="760" fill="#fff"/>
  <rect class="actor" x="35" y="286" width="270" height="150" rx="2"/>
  <text class="actor-label" x="170" y="350"><tspan x="170">Member /</tspan><tspan x="170" dy="31">Applicant</tspan></text>

  <rect class="system" x="850" y="230" width="500" height="250" rx="18"/>
  <path class="header" d="M868 230h464a18 18 0 0 1 18 18v35H850v-35a18 18 0 0 1 18-18z"/>
  <text class="number" x="1100" y="263">0</text>
  <text class="system-label" x="1100" y="345"><tspan x="1100">IronGrind Membership and</tspan><tspan x="1100" dy="34">Operations Management System</tspan></text>

  <rect class="actor" x="1880" y="65" width="280" height="145" rx="2"/>
  <text class="actor-label" x="2020" y="148">Administrator</text>
  <rect class="actor" x="1880" y="530" width="280" height="145" rx="2"/>
  <text class="actor-label" x="2020" y="613">Authorized Staff</text>

  <path class="flow" d="M305 325 H850"/>
  <text class="flow-label" x="365" y="277"><tspan x="365">Credentials, registration details, renewal</tspan><tspan x="365" dy="23">requests, and permitted profile changes</tspan></text>
  <path class="flow" d="M850 405 H305"/>
  <text class="flow-label" x="365" y="455"><tspan x="365">Sign-in / application status; own membership,</tspan><tspan x="365" dy="23">QR, visits, and product catalog</tspan></text>

  <path class="flow" d="M1880 160 C1685 175 1535 255 1350 300"/>
  <text class="flow-label" x="1450" y="215"><tspan x="1450">Review online applications / renewals; manage</tspan><tspan x="1450" dy="22">memberships, inventory, staff, and devices</tspan></text>
  <path class="flow" d="M1350 350 C1535 320 1690 230 1880 190"/>
  <text class="flow-label" x="1460" y="365"><tspan x="1460">Operation results; member, staff, and device status;</tspan><tspan x="1460" dy="22">reports and activity logs</tspan></text>

  <path class="flow" d="M1880 575 C1685 560 1535 445 1350 405"/>
  <text class="flow-label" x="1450" y="485"><tspan x="1450">Credentials; counter work; request decisions;</tspan><tspan x="1450" dy="22">QR scans and product sales</tspan></text>
  <path class="flow" d="M1350 445 C1535 465 1685 580 1880 610"/>
  <text class="flow-label" x="1450" y="660"><tspan x="1450">Access and task results; permitted attendance</tspan><tspan x="1450" dy="22">and own product-sale records</tspan></text>

  <text class="note" x="35" y="725">Walk-in customers transact through an operator. Payment is recorded at the gym; the diagram does not represent an online payment gateway or customer receipt.</text>
</svg>
