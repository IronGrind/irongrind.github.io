<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="2020" viewBox="0 0 1820 2020" role="img" aria-labelledby="title desc">
  <title id="title">Iron Grind Level 1 Data Flow Diagram</title>
  <desc id="desc">Eight Level 1 processes mapped to functional requirements FR-01 through FR-10, with external actors and data stores.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263445"/>
    </marker>
    <style>
