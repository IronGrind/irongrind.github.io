      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #526173; }
      .column { font-size: 15px; font-weight: 700; letter-spacing: 1px; fill: #526173; }
      .actor { fill: #dce8f8; stroke: #263445; stroke-width: 2; }
      .process { fill: #ffffff; stroke: #263445; stroke-width: 2; }
      .process-head { fill: #dce8f8; stroke: #263445; stroke-width: 2; }
      .store { fill: #e8f0fb; stroke: #263445; stroke-width: 2; }
      .rule { stroke: #263445; stroke-width: 2; }
      .flow { fill: none; stroke: #263445; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .store-read { fill: none; stroke: #34715d; stroke-width: 2; marker-end: url(#arrow); }
      .store-write { fill: none; stroke: #b46a2d; stroke-width: 2; marker-end: url(#arrow); }
      .store-rw { fill: none; stroke: #263445; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .actor-text { font-size: 16px; font-weight: 700; text-anchor: middle; }
      .number { font-size: 15px; font-weight: 700; text-anchor: middle; }
      .process-name { font-size: 20px; font-weight: 700; text-anchor: middle; }
      .fr { font-size: 14px; fill: #526173; text-anchor: middle; }
      .store-id { font-size: 13px; font-weight: 700; text-anchor: middle; }
      .store-name { font-size: 14px; font-weight: 700; }
      .store-mode { font-size: 12px; fill: #526173; text-anchor: end; }
      .legend { font-size: 14px; fill: #526173; }
      .legend-line { fill: none; stroke-width: 2; }
    </style>
  </defs>
