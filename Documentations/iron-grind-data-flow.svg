<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2040" viewBox="0 0 1800 2040" role="img" aria-labelledby="title desc">
  <title id="title">Iron Grind Fitness Gym Membership and Operations Data Flow Diagram</title>
  <desc id="desc">A Level 1 data flow diagram organized into separate workflow lanes for authentication, membership applications, member portal, attendance, inventory, sales, reporting, and planned email notifications. Each process is connected directly to the relevant Supabase data stores.</desc>
  <defs>
    <marker id="requestArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#174b73"/></marker>
    <marker id="responseArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#687583"/></marker>
    <marker id="futureArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a05a00"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#171717}.title{font-size:25px;font-weight:700}.subtitle{font-size:16px;font-weight:700}.body{font-size:12px}.small{font-size:10px}.tiny{font-size:9px}
      .actor{fill:#f2eafa;stroke:#44334e;stroke-width:1.5}.process{fill:#dff6fb;stroke:#16798b;stroke-width:1.6}.store{fill:#fff3b3;stroke:#8d7416;stroke-width:1.4}.service{fill:#f2f2f2;stroke:#666;stroke-width:1.2}.futureBox{fill:#fffaf1;stroke:#a05a00;stroke-width:1.6;stroke-dasharray:7 5}.lane{fill:#fafbfd;stroke:#d9dfe5;stroke-width:1}
      .request{fill:none;stroke:#174b73;stroke-width:2;stroke-linecap:round;marker-end:url(#requestArrow)}.exchange{fill:none;stroke:#087f8c;stroke-width:2;stroke-linecap:round;marker-start:url(#requestArrow);marker-end:url(#responseArrow)}.response{fill:none;stroke:#687583;stroke-width:1.8;stroke-dasharray:8 6;stroke-linecap:round;marker-end:url(#responseArrow)}.planned{fill:none;stroke:#a05a00;stroke-width:2;stroke-dasharray:8 6;stroke-linecap:round;marker-end:url(#futureArrow)}
      .flowLabel{font-size:10px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1800" height="2040" fill="#fff"/>
  <text x="900" y="40" text-anchor="middle" class="title">IRON GRIND FITNESS GYM MEMBERSHIP &amp; OPERATIONS MANAGEMENT SYSTEM</text>
  <text x="900" y="70" text-anchor="middle" class="subtitle">LEVEL 1 DATA FLOW DIAGRAM</text>

  <!-- Shared authentication entry point -->
  <rect x="60" y="105" width="240" height="68" rx="5" class="actor"/>
  <text x="180" y="134" text-anchor="middle" class="subtitle">Member / Applicant</text>
  <text x="180" y="155" text-anchor="middle" class="small">login or create an account</text>
  <rect x="1500" y="105" width="240" height="68" rx="5" class="actor"/>
  <text x="1620" y="134" text-anchor="middle" class="subtitle">Administrator</text>
  <text x="1620" y="155" text-anchor="middle" class="small">sign in to manage gym operations</text>
  <rect x="600" y="102" width="600" height="76" rx="20" class="process"/>
  <text x="900" y="133" text-anchor="middle" class="subtitle">1.0 Authenticate User</text>
  <text x="900" y="155" text-anchor="middle" class="small">Supabase Auth verifies credentials and creates the session</text>
  <path d="M300 139H600" class="request"/><text x="447" y="128" text-anchor="middle" class="flowLabel">credentials / sign-in request</text>
  <path d="M1500 151H1200" class="request"/><text x="1353" y="140" text-anchor="middle" class="flowLabel">administrator credentials</text>
  <rect x="600" y="220" width="600" height="66" rx="8" class="service"/>
  <text x="900" y="248" text-anchor="middle" class="subtitle">Load profile and role &#183; route to member or admin page</text>
  <text x="900" y="270" text-anchor="middle" class="small">A database trigger creates the profile row for a new Auth user</text>
  <path d="M900 178V215" class="response"/><text x="914" y="202" class="flowLabel">authenticated session</text>

  <!-- Repeated actor symbols keep each workflow connection short and readable. -->
  <text x="900" y="318" text-anchor="middle" class="small">Repeated actor boxes in the workflow lanes represent the same Member / Applicant and Administrator shown above.</text>

  <!-- Registration and review lane -->
  <rect x="35" y="340" width="1730" height="210" rx="12" class="lane"/>
  <text x="60" y="369" class="subtitle">A · Registration and membership review</text>
  <rect x="65" y="383" width="230" height="54" rx="5" class="actor"/>
  <text x="180" y="406" text-anchor="middle" class="subtitle">Member / Applicant</text>
  <text x="180" y="425" text-anchor="middle" class="small">submits registration / renewal</text>
  <rect x="65" y="455" width="230" height="54" rx="5" class="actor"/>
  <text x="180" y="478" text-anchor="middle" class="subtitle">Administrator</text>
  <text x="180" y="497" text-anchor="middle" class="small">reviews and decides</text>
  <rect x="430" y="382" width="350" height="128" rx="20" class="process"/>
  <text x="605" y="411" text-anchor="middle" class="subtitle">2.0 Process Membership Applications</text>
  <text x="605" y="438" text-anchor="middle" class="small">save submission; set pending / approved / rejected</text>
  <text x="605" y="462" text-anchor="middle" class="small">admin decision updates application status</text>
  <text x="605" y="486" text-anchor="middle" class="small">approval creates / updates member and sale records</text>
  <path d="M295 410H430" class="request"/><text x="360" y="399" text-anchor="middle" class="flowLabel">application details</text>
  <path d="M295 482H430" class="request"/><text x="360" y="471" text-anchor="middle" class="flowLabel">review decision</text>
  <rect x="1220" y="383" width="510" height="118" class="store"/>
  <text x="1475" y="410" text-anchor="middle" class="subtitle">Membership records</text>
  <text x="1475" y="435" text-anchor="middle" class="body">D2 · membership_applications</text>
  <text x="1475" y="456" text-anchor="middle" class="body">D3 · members · D8 · membership_history</text>
  <text x="1475" y="479" text-anchor="middle" class="small">D6 · sales when membership payment is recorded</text>
  <path d="M780 445H1220" class="request"/>
  <path d="M1220 455H780" class="response"/><text x="997" y="439" text-anchor="middle" class="flowLabel">application writes / status and member data returned</text>
  <!-- Member portal lane -->
  <rect x="35" y="570" width="1730" height="190" rx="12" class="lane"/>
  <text x="60" y="599" class="subtitle">B &#183; Member portal</text>
  <rect x="65" y="626" width="230" height="65" rx="5" class="actor"/>
  <text x="180" y="653" text-anchor="middle" class="subtitle">Member</text>
  <text x="180" y="674" text-anchor="middle" class="small">views account and submits requests</text>
  <rect x="430" y="616" width="350" height="85" rx="20" class="process"/>
  <text x="585" y="647" text-anchor="middle" class="subtitle">3.0 Manage Member Portal</text>
  <text x="585" y="671" text-anchor="middle" class="small">show own membership, attendance and active products</text>
  <text x="585" y="689" text-anchor="middle" class="small">submit renewal / personal-information request</text>
  <path d="M295 658H430" class="request"/><text x="360" y="647" text-anchor="middle" class="flowLabel">portal request</text>
  <rect x="1220" y="613" width="510" height="98" class="store"/>
  <text x="1475" y="641" text-anchor="middle" class="subtitle">Member-scoped records &#183; access limited by RLS / RPC</text>
  <text x="1475" y="666" text-anchor="middle" class="body">D1 &#183; profiles &#183; D2 &#183; membership_applications &#183; D3 &#183; members</text>
  <text x="1475" y="690" text-anchor="middle" class="body">D4 &#183; attendance &#183; D5 &#183; products</text>
  <path d="M780 653H1220" class="request"/>
  <path d="M1220 663H780" class="response"/><text x="997" y="645" text-anchor="middle" class="flowLabel">own-record queries / renewal and update requests</text>
  <path d="M430 690H330V718H180V691" class="response"/><text x="260" y="713" text-anchor="middle" class="flowLabel">membership details / attendance history / request result</text>

  <!-- Attendance lane -->
  <rect x="35" y="780" width="1730" height="170" rx="12" class="lane"/>
  <text x="60" y="809" class="subtitle">C &#183; Attendance and QR check-in</text>
  <rect x="65" y="832" width="230" height="65" rx="5" class="actor"/>
  <text x="180" y="859" text-anchor="middle" class="subtitle">Administrator</text>
  <text x="180" y="880" text-anchor="middle" class="small">scans member QR code</text>
  <rect x="430" y="822" width="350" height="85" rx="20" class="process"/>
  <text x="585" y="853" text-anchor="middle" class="subtitle">4.0 Record Attendance</text>
  <text x="585" y="877" text-anchor="middle" class="small">resolve member; save check-in or update check-out</text>
  <text x="585" y="895" text-anchor="middle" class="small">member portal can read own attendance history</text>
  <path d="M295 864H430" class="request"/><text x="360" y="853" text-anchor="middle" class="flowLabel">QR scan / check-out</text>
  <rect x="1220" y="819" width="510" height="91" class="store"/>
  <text x="1475" y="848" text-anchor="middle" class="subtitle">Attendance data</text>
  <text x="1475" y="875" text-anchor="middle" class="body">D3 &#183; members (member lookup) &#183; D4 &#183; attendance (insert / update / history)</text>
  <path d="M780 859H1220" class="request"/>
  <path d="M1220 869H780" class="response"/><text x="997" y="851" text-anchor="middle" class="flowLabel">member lookup / attendance write and result</text>
  <path d="M430 896H330V923H180V897" class="response"/><text x="260" y="917" text-anchor="middle" class="flowLabel">attendance confirmation / query result</text>

  <!-- Inventory lane -->
  <rect x="35" y="970" width="1730" height="160" rx="12" class="lane"/>
  <text x="60" y="999" class="subtitle">D &#183; Inventory and product catalog</text>
  <rect x="65" y="1020" width="230" height="65" rx="5" class="actor"/>
  <text x="180" y="1047" text-anchor="middle" class="subtitle">Administrator</text>
  <text x="180" y="1068" text-anchor="middle" class="small">maintains products and stock</text>
  <rect x="430" y="1010" width="350" height="85" rx="20" class="process"/>
  <text x="585" y="1041" text-anchor="middle" class="subtitle">5.0 Manage Inventory</text>
  <text x="585" y="1065" text-anchor="middle" class="small">create / update products, prices and stock</text>
  <text x="585" y="1083" text-anchor="middle" class="small">member portal reads active products</text>
  <path d="M295 1052H430" class="request"/><text x="360" y="1041" text-anchor="middle" class="flowLabel">product changes</text>
  <rect x="1220" y="1014" width="510" height="78" class="store"/>
  <text x="1475" y="1043" text-anchor="middle" class="subtitle">D5 &#183; products</text>
  <text x="1475" y="1068" text-anchor="middle" class="body">Product details, active catalog and stock quantity</text>
  <path d="M780 1047H1220" class="request"/>
  <path d="M1220 1057H780" class="response"/><text x="997" y="1039" text-anchor="middle" class="flowLabel">product read / insert / update / delete</text>
  <path d="M430 1084H330V1106H180V1085" class="response"/><text x="260" y="1100" text-anchor="middle" class="flowLabel">updated product / current catalog</text>

  <!-- Walk-in sales lane -->
  <rect x="35" y="1150" width="1730" height="180" rx="12" class="lane"/>
  <text x="60" y="1179" class="subtitle">E &#183; Walk-in POS and receipts</text>
  <rect x="65" y="1203" width="230" height="65" rx="5" class="actor"/>
  <text x="180" y="1230" text-anchor="middle" class="subtitle">Administrator</text>
  <text x="180" y="1251" text-anchor="middle" class="small">enters walk-in sale</text>
  <rect x="430" y="1193" width="350" height="85" rx="20" class="process"/>
  <text x="585" y="1224" text-anchor="middle" class="subtitle">6.0 Process Walk-in Sale</text>
  <text x="585" y="1248" text-anchor="middle" class="small">record_walk_in_sale() validates and records the transaction</text>
  <text x="585" y="1266" text-anchor="middle" class="small">creates receipt lines and updates merchandise stock</text>
  <path d="M295 1235H430" class="request"/><text x="360" y="1224" text-anchor="middle" class="flowLabel">sale / item details</text>
  <rect x="1220" y="1190" width="510" height="94" class="store"/>
  <text x="1475" y="1219" text-anchor="middle" class="subtitle">POS data stores</text>
  <text x="1475" y="1244" text-anchor="middle" class="body">D5 &#183; products (validate / update stock) &#183; D6 &#183; sales (receipt)</text>
  <text x="1475" y="1267" text-anchor="middle" class="body">D7 &#183; sale_items (receipt lines)</text>
  <path d="M780 1230H1220" class="request"/>
  <path d="M1220 1240H780" class="response"/><text x="997" y="1222" text-anchor="middle" class="flowLabel">stock validation / receipt writes / sale result</text>
  <path d="M430 1267H330V1296H180V1268" class="response"/><text x="260" y="1291" text-anchor="middle" class="flowLabel">receipt / sale confirmation</text>

  <!-- Reporting lane -->
  <rect x="35" y="1350" width="1730" height="170" rx="12" class="lane"/>
  <text x="60" y="1379" class="subtitle">F &#183; Reports and exports</text>
  <rect x="65" y="1402" width="230" height="65" rx="5" class="actor"/>
  <text x="180" y="1429" text-anchor="middle" class="subtitle">Administrator</text>
  <text x="180" y="1450" text-anchor="middle" class="small">selects report filters / date</text>
  <rect x="430" y="1392" width="350" height="85" rx="20" class="process"/>
  <text x="585" y="1423" text-anchor="middle" class="subtitle">7.0 Query Reports and History</text>
  <text x="585" y="1447" text-anchor="middle" class="small">filter membership, attendance, inventory and sales data</text>
  <text x="585" y="1465" text-anchor="middle" class="small">return dashboard summaries and export results</text>
  <path d="M295 1434H430" class="request"/><text x="360" y="1423" text-anchor="middle" class="flowLabel">filters / date range</text>
  <rect x="1220" y="1389" width="510" height="94" class="store"/>
  <text x="1475" y="1418" text-anchor="middle" class="subtitle">Report source records</text>
  <text x="1475" y="1443" text-anchor="middle" class="body">D2 &#183; membership_applications &#183; D3 &#183; members &#183; D4 &#183; attendance</text>
  <text x="1475" y="1466" text-anchor="middle" class="body">D5 &#183; products &#183; D6 &#183; sales &#183; D7 &#183; sale_items &#183; D8 &#183; membership_history</text>
  <path d="M780 1429H1220" class="request"/>
  <path d="M1220 1439H780" class="response"/><text x="997" y="1421" text-anchor="middle" class="flowLabel">authorized queries / report data</text>
  <path d="M430 1466H330V1491H180V1467" class="response"/><text x="260" y="1486" text-anchor="middle" class="flowLabel">report output / export</text>

  <!-- Email service is planned and intentionally has no live connection in this DFD. -->
  <rect x="380" y="1542" width="410" height="90" rx="18" class="futureBox"/>
  <text x="585" y="1574" text-anchor="middle" class="subtitle">8.0 Email Notifications · Planned</text>
  <text x="585" y="1598" text-anchor="middle" class="small">Approval and expiry reminders are not implemented yet</text>
  <text x="585" y="1617" text-anchor="middle" class="small">Email provider has not been selected</text>

  <!-- Backend services and database -->
  <rect x="120" y="1660" width="1560" height="110" rx="14" class="service"/>
  <text x="900" y="1695" text-anchor="middle" class="subtitle">Supabase Data API / RPC &#183; Row-Level Security</text>
  <text x="900" y="1720" text-anchor="middle" class="body">Authenticated browser requests are checked by RLS; RPC operations validate and authorize sensitive changes.</text>
  <text x="900" y="1744" text-anchor="middle" class="body">The admin-create-member Edge Function verifies the administrator before privileged account creation.</text>
  <text x="900" y="1762" text-anchor="middle" class="small">Realtime publication sends membership_applications and attendance changes to subscribed website views.</text>
  <path d="M900 1770V1792" class="request"/>
  <rect x="240" y="1800" width="1320" height="104" rx="18" fill="#222"/>
  <text x="900" y="1833" text-anchor="middle" style="fill:#fff;font-size:20px;font-weight:700">SUPABASE POSTGRESQL</text>
  <text x="900" y="1860" text-anchor="middle" style="fill:#fff;font-size:13px">profiles &#183; members &#183; membership_applications &#183; attendance &#183; products</text>
  <text x="900" y="1883" text-anchor="middle" style="fill:#fff;font-size:13px">sales &#183; sale_items &#183; membership_history</text>

  <!-- Line key -->
  <rect x="120" y="1920" width="1560" height="60" rx="10" fill="#f6f2f2" stroke="#555"/>
  <text x="150" y="1956" class="small" font-weight="700">LINE KEY</text>
  <path d="M280 1950H380" class="request"/><text x="395" y="1955" class="small">input / data write</text>
  <path d="M650 1945H750" class="request"/><path d="M750 1955H650" class="response"/><text x="765" y="1955" class="small">read request / returned result</text>
  <path d="M1120 1950H1220" class="response"/><text x="1235" y="1955" class="small">response to user / administrator</text>
  <path d="M1520 1950H1580" class="planned"/><text x="1590" y="1955" class="small">planned</text>
  <text x="900" y="2020" text-anchor="middle" class="subtitle">Figure 4. Data Flow Diagram</text>
</svg>




