<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" role="img" aria-labelledby="title desc">
<title id="title">Iron Grind Context Diagram</title>
<desc id="desc">Context-level data flow diagram showing the Administrator on the left and the Member / Applicant on the right exchanging information with the Iron Grind Fitness Gym Membership and Operations Management System.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#000"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}
    .title{font-size:26px;font-weight:700}
    .entity{fill:#d5e2f5;stroke:#000;stroke-width:5}
    .process{fill:#f7f7f7;stroke:#000;stroke-width:5}
    .processHeader{fill:#d5e2f5}
    .rule{stroke:#000;stroke-width:3}
    .entityTitle{font-size:22px;font-weight:700}
    .processNum{font-size:18px;font-weight:700}
    .processTitle{font-size:23px;font-weight:700}
    .flowTitle{font-size:15px;font-weight:700;fill:#344054}
    .flow{font-size:14px;fill:#344054}
    .note{font-size:13px;fill:#667085}
    .dataflow{fill:none;stroke:#000;stroke-width:3;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1700" height="1120" fill="#fff"/>
<text x="850" y="52" text-anchor="middle" class="title">IRON GRIND FITNESS GYM MEMBERSHIP &amp; OPERATIONS MANAGEMENT SYSTEM</text>
<text x="850" y="82" text-anchor="middle" class="flowTitle">CONTEXT DIAGRAM</text>

<!-- External entities -->
<rect x="55" y="420" width="250" height="150" class="entity"/>
<text x="180" y="510" text-anchor="middle" class="entityTitle">Administrator</text>
<rect x="1395" y="420" width="250" height="150" class="entity"/>
<text x="1520" y="495" text-anchor="middle" class="entityTitle">Member /</text>
<text x="1520" y="525" text-anchor="middle" class="entityTitle">Applicant</text>

<!-- Central context process -->
<rect x="600" y="145" width="500" height="665" rx="42" class="process"/>
<path d="M642 147H1058A40 40 0 0 1 1098 187V215H602V187A40 40 0 0 1 642 147Z" class="processHeader"/>
<path d="M600 215H1100" class="rule"/>
<text x="850" y="190" text-anchor="middle" class="processNum">0</text>
<text x="850" y="380" text-anchor="middle" class="processTitle">Iron Grind Fitness Gym</text>
<text x="850" y="418" text-anchor="middle" class="processTitle">Membership &amp; Operations</text>
<text x="850" y="456" text-anchor="middle" class="processTitle">Management System</text>
<text x="850" y="520" text-anchor="middle" class="flow">Handles authentication, membership, attendance,</text>
<text x="850" y="545" text-anchor="middle" class="flow">inventory, sales, member services, and reporting</text>

<!-- Administrator data flows -->
<path d="M305 340H600" class="dataflow"/>
<text x="452" y="190" text-anchor="middle" class="flowTitle">ADMINISTRATOR TO SYSTEM</text>
<text x="452" y="220" text-anchor="middle" class="flow">Sign-in credentials</text>
<text x="452" y="245" text-anchor="middle" class="flow">Application review decisions</text>
<text x="452" y="270" text-anchor="middle" class="flow">Member, attendance, and inventory updates</text>
<text x="452" y="295" text-anchor="middle" class="flow">Walk-in sale entries and report requests</text>

<path d="M600 650H305" class="dataflow"/>
<text x="452" y="605" text-anchor="middle" class="flowTitle">SYSTEM TO ADMINISTRATOR</text>
<text x="452" y="680" text-anchor="middle" class="flow">Authentication result and dashboard data</text>
<text x="452" y="705" text-anchor="middle" class="flow">Application, member, and attendance records</text>
<text x="452" y="730" text-anchor="middle" class="flow">Inventory and sales records; receipts</text>
<text x="452" y="755" text-anchor="middle" class="flow">Generated reports and exports</text>

<!-- Member / Applicant data flows -->
<path d="M1395 340H1100" class="dataflow"/>
<text x="1247" y="190" text-anchor="middle" class="flowTitle">MEMBER / APPLICANT TO SYSTEM</text>
<text x="1247" y="220" text-anchor="middle" class="flow">Sign-in credentials</text>
<text x="1247" y="245" text-anchor="middle" class="flow">Registration details and membership application</text>
<text x="1247" y="270" text-anchor="middle" class="flow">Renewal requests and profile updates</text>
<text x="1247" y="295" text-anchor="middle" class="flow">Member requests</text>

<path d="M1100 650H1395" class="dataflow"/>
<text x="1247" y="605" text-anchor="middle" class="flowTitle">SYSTEM TO MEMBER / APPLICANT</text>
<text x="1247" y="680" text-anchor="middle" class="flow">Authentication result and application status</text>
<text x="1247" y="705" text-anchor="middle" class="flow">Membership details and attendance history</text>
<text x="1247" y="730" text-anchor="middle" class="flow">Active product catalog and account information</text>
</svg>
