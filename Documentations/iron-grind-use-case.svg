<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1510" viewBox="0 0 2100 1510" role="img" aria-labelledby="title desc">
<title id="title">Iron Grind Detailed Use Case Diagram</title>
<desc id="desc">Detailed UML use case diagram for Iron Grind, with Applicant/Member as one lifecycle actor and Administrator/Staff as a separate actor. It shows authentication, registration, member portal functions, application and membership management, attendance, inventory, point of sale, and reports.</desc>
<defs>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111820}
    .title{font-size:26px;font-weight:700}
    .boundaryTitle{font-size:17px;font-weight:700}
    .group{font-size:13px;font-weight:700;letter-spacing:.8px;fill:#344054}
    .actorLabel{font-size:14px;font-weight:700}
    .caseTitle{font-size:13px;font-weight:700}
    .caseDetail{font-size:10.5px;fill:#4b5564}
    .small{font-size:11px;fill:#4b5564}
    .boundary{fill:#fbfcfd;stroke:#273342;stroke-width:2.3}
    .usecase{fill:#fff;stroke:#273342;stroke-width:2}
    .association{fill:none;stroke:#434d5b;stroke-width:1.55}
    .actor{fill:#111820;stroke:#111820;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="2100" height="1510" fill="#fff"/>
<text x="1050" y="40" text-anchor="middle" class="title">IRON GRIND FITNESS GYM MEMBERSHIP &amp; OPERATIONS MANAGEMENT SYSTEM</text>
<rect x="340" y="78" width="1420" height="1370" rx="8" class="boundary"/>
<text x="1050" y="111" text-anchor="middle" class="boundaryTitle">Iron Grind System</text>

<!-- Actor association connectors, placed behind use cases -->
<path d="M180 680H285M285 165V1160M285 165H830M285 300H520M285 435H520M285 590H520M285 720H520M285 850H520M285 980H520M285 1110H520" class="association"/>
<path d="M1920 680H1815M1815 165V1245M1815 165H1270M1815 300H1660M1815 435H1660M1815 570H1660M1815 705H1660M1815 840H1660M1815 975H1660M1815 1110H1660M1815 1245H1660" class="association"/>

<!-- Shared account access -->
<ellipse cx="1050" cy="165" rx="220" ry="42" class="usecase"/>
<text x="1050" y="160" text-anchor="middle" class="caseTitle">Authenticate account</text>
<text x="1050" y="179" text-anchor="middle" class="caseDetail">Sign in, sign out, and recover password</text>

<!-- Applicant / Member lifecycle -->
<text x="740" y="220" text-anchor="middle" class="group">APPLICANT AND MEMBER FUNCTIONS</text>
<text x="740" y="239" text-anchor="middle" class="small">One person uses applicant functions before approval and member functions after approval.</text>
<ellipse cx="740" cy="300" rx="220" ry="48" class="usecase"/>
<text x="740" y="294" text-anchor="middle" class="caseTitle">Register and submit membership application</text>
<text x="740" y="314" text-anchor="middle" class="caseDetail">Enter personal, emergency, health, and plan details; provide signature</text>
<ellipse cx="740" cy="435" rx="220" ry="46" class="usecase"/>
<text x="740" y="430" text-anchor="middle" class="caseTitle">Check application status</text>
<text x="740" y="449" text-anchor="middle" class="caseDetail">View pending, approved, or rejected status</text>
<ellipse cx="740" cy="590" rx="220" ry="46" class="usecase"/>
<text x="740" y="585" text-anchor="middle" class="caseTitle">View membership dashboard</text>
<text x="740" y="604" text-anchor="middle" class="caseDetail">Plan, dates, status, progress, and visit summary</text>
<ellipse cx="740" cy="720" rx="220" ry="46" class="usecase"/>
<text x="740" y="715" text-anchor="middle" class="caseTitle">View personal attendance history</text>
<text x="740" y="734" text-anchor="middle" class="caseDetail">See recorded check-in and check-out visits</text>
<ellipse cx="740" cy="850" rx="220" ry="46" class="usecase"/>
<text x="740" y="845" text-anchor="middle" class="caseTitle">Manage profile and fitness settings</text>
<text x="740" y="864" text-anchor="middle" class="caseDetail">Update personal information, preferences, and goals</text>
<ellipse cx="740" cy="980" rx="220" ry="46" class="usecase"/>
<text x="740" y="975" text-anchor="middle" class="caseTitle">Browse active product catalog</text>
<text x="740" y="994" text-anchor="middle" class="caseDetail">View available products, prices, and stock</text>
<ellipse cx="740" cy="1110" rx="220" ry="46" class="usecase"/>
<text x="740" y="1105" text-anchor="middle" class="caseTitle">Submit membership renewal request</text>
<text x="740" y="1124" text-anchor="middle" class="caseDetail">Send renewal application for staff review</text>

<!-- Administrator / Staff functions -->
<text x="1435" y="220" text-anchor="middle" class="group">ADMINISTRATOR AND STAFF FUNCTIONS</text>
<ellipse cx="1435" cy="300" rx="225" ry="46" class="usecase"/>
<text x="1435" y="295" text-anchor="middle" class="caseTitle">Review membership applications</text>
<text x="1435" y="314" text-anchor="middle" class="caseDetail">Inspect details; approve or reject application</text>
<ellipse cx="1435" cy="435" rx="225" ry="46" class="usecase"/>
<text x="1435" y="430" text-anchor="middle" class="caseTitle">Create member account</text>
<text x="1435" y="449" text-anchor="middle" class="caseDetail">Register walk-in member and record membership sale</text>
<ellipse cx="1435" cy="570" rx="225" ry="46" class="usecase"/>
<text x="1435" y="565" text-anchor="middle" class="caseTitle">Manage member and membership records</text>
<text x="1435" y="584" text-anchor="middle" class="caseDetail">Update details, renew or change plan, view history</text>
<ellipse cx="1435" cy="705" rx="225" ry="46" class="usecase"/>
<text x="1435" y="700" text-anchor="middle" class="caseTitle">Record member attendance</text>
<text x="1435" y="719" text-anchor="middle" class="caseDetail">Find member by QR or lookup; check in and check out</text>
<ellipse cx="1435" cy="840" rx="225" ry="46" class="usecase"/>
<text x="1435" y="835" text-anchor="middle" class="caseTitle">Manage products and inventory</text>
<text x="1435" y="854" text-anchor="middle" class="caseDetail">Add, edit, archive products, and manage stock</text>
<ellipse cx="1435" cy="975" rx="225" ry="46" class="usecase"/>
<text x="1435" y="970" text-anchor="middle" class="caseTitle">Record walk-in product sale</text>
<text x="1435" y="989" text-anchor="middle" class="caseDetail">Validate stock, save receipt and items, update merchandise</text>
<ellipse cx="1435" cy="1110" rx="225" ry="46" class="usecase"/>
<text x="1435" y="1105" text-anchor="middle" class="caseTitle">View dashboard and operational reports</text>
<text x="1435" y="1124" text-anchor="middle" class="caseDetail">Filter membership, attendance, inventory, and sales</text>
<ellipse cx="1435" cy="1245" rx="225" ry="46" class="usecase"/>
<text x="1435" y="1240" text-anchor="middle" class="caseTitle">Export reports</text>
<text x="1435" y="1259" text-anchor="middle" class="caseDetail">Create monthly PDF reports and attendance CSV</text>

<!-- Actors -->
<g transform="translate(110 620)"><circle cx="35" cy="18" r="17" class="actor"/><path d="M5 99c2-34 12-52 30-52s28 18 30 52M35 49v47M13 70l22 13 22-13" fill="none" class="actor"/></g>
<text x="145" y="745" text-anchor="middle" class="actorLabel">Applicant / Member</text>
<g transform="translate(1885 620)"><circle cx="35" cy="18" r="17" class="actor"/><path d="M5 99c2-34 12-52 30-52s28 18 30 52M35 49v47M13 70l22 13 22-13" fill="none" class="actor"/><rect x="48" y="63" width="36" height="28" rx="3" fill="#fff" stroke="#111820" stroke-width="3"/><path d="M57 63v-8h18v8" fill="none" stroke="#111820" stroke-width="3"/></g>
<text x="1920" y="745" text-anchor="middle" class="actorLabel">Administrator / Staff</text>
<text x="1050" y="1480" text-anchor="middle" class="small">Solid lines show actor associations with system functions.</text>
</svg>
